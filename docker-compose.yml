services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: signalradio
      POSTGRES_USER: signalradio
      POSTGRES_PASSWORD: signalradio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalradio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=signalradio;Username=signalradio;Password=signalradio
      - StorageType=Local
      - StoragePath=/data/recordings
      - ASR__Provider=stub
      - AI__Enabled=false
      - AI__EmbeddingProvider=local
      - AI__ModelPath=/models/minilm
      - Simulator__Enabled=false
      - Simulator__IntervalSeconds=5
      - Simulator__TalkGroups=1,2,3,4,5
    volumes:
      - recordings:/data/recordings
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  trunk-recorder:
    image: robotastic/trunk-recorder:latest
    command: ["trunk-recorder", "--config=/app/config/trunk-recorder.json"]
    environment:
      - UPLOAD_SCRIPT=/app/scripts/upload_callback.sh
      - API_ENDPOINT=http://api:8080/api/recordings/upload
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - trunk-recordings:/app/audio
      - temp:/app/temp
      - logs:/app/logs
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    restart: unless-stopped
    depends_on:
      - api

  web:
    build:
      context: ./src/SignalRadio.Web
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  pgdata:
  recordings:
  trunk-recordings:
  temp:
  logs:
