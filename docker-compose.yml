services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: signalradio
      POSTGRES_USER: signalradio
      POSTGRES_PASSWORD: signalradio
    ports:
      - "5432:5432"
    volumes:
      - /mnt/sda/volumes/SignalRadio2/pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalradio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=signalradio;Username=signalradio;Password=signalradio
      - StorageType=Local
      - StoragePath=/data/recordings
      - ASR__Provider=whisper
      # Overridden by ASR__Endpoint in .env if set
      - ASR__Endpoint=${ASR__Endpoint:-http://whisper-asr:9000}
      - ASR__Language=en
      - AI__Enabled=false
      - AI__EmbeddingProvider=local
      - AI__ModelPath=/models/minilm
      - Simulator__Enabled=false
      - Simulator__IntervalSeconds=5
      - Simulator__TalkGroups=1,2,3,4,5
      # Feature flags
      - Features__Asr=true
      - Features__Embeddings=true
      - Features__Summaries=true
      # Pipeline tuning
      - Pipeline__RecentBatchSize=10
      - Pipeline__RecentLookbackMinutes=5
      - Pipeline__BackfillBatchSize=20
      - Pipeline__BackfillLookbackHours=24
      - Pipeline__MaxConcurrent=2
      - Pipeline__PollIntervalSeconds=10
      - Pipeline__BackfillPollIntervalSeconds=60
      # Summaries agent tuning
      - Summaries__WindowMinutes=60
      - Summaries__MinTranscripts=5
      - Summaries__MaxTranscriptsPerRun=50
      - Summaries__PollIntervalSeconds=300
      # AI agent (OpenAI-compatible endpoint for MAF agents)
      - AI__Endpoint=http://192.168.1.225:8000/v1
      - AI__ApiKey=not-needed
      - AI__Model=Qwen3.8-27B
      # Talk group CSV import (rich talkgroup info for the UI)
      - TalkGroups__CsvPath=/app/config/danecom-talkgroups.csv
    volumes:
      - /mnt/sda/volumes/SignalRadio2/recordings:/data/recordings
      - ./models:/models:ro
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  trunk-recorder:
    image: robotastic/trunk-recorder:latest
    command: ["trunk-recorder", "--config=/app/config/trunk-recorder.json"]
    environment:
      - UPLOAD_SCRIPT=/app/scripts/upload_callback.sh
      - API_ENDPOINT=http://api:8080/api/recordings/upload
    volumes:
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - trunk-recordings:/app/audio
      - temp:/app/temp
      - logs:/app/logs
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    restart: unless-stopped
    depends_on:
      - api

  web:
    build:
      context: ./src/SignalRadio.Web
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  trunk-recordings:
  temp:
  logs:
